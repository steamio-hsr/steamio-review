<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087df1">
  <meta name="description" content="Share your STEAMIO HSR experience in three quick taps.">
  <title>STEAMIO HSR Reviews</title>
  <style>
    :root {
      --blue: #087df1;
      --deep-blue: #07366f;
      --ink: #10233f;
      --sky: #eaf6ff;
      --line: #cbe5f7;
      --muted: #667f98;
      --green: #34a853;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html { background: var(--sky); }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Trebuchet MS", Arial, sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(255,255,255,.95) 0 7%, transparent 26%),
        linear-gradient(145deg, #f2fbff 0%, #d9efff 55%, #badfff 100%);
    }

    button, textarea { font: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      padding: 18px;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      opacity: .14;
      background-image: repeating-radial-gradient(
        ellipse at 50% 50%,
        transparent 0 18px,
        #0c8df3 19px 21px,
        transparent 22px 38px
      );
      background-size: 178px 116px;
      transform: rotate(-8deg);
    }

    .card {
      width: min(100%, 520px);
      min-height: min(760px, calc(100svh - 36px));
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(8,125,241,.22);
      border-radius: 30px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 28px 80px rgba(7,54,111,.18), 0 4px 14px rgba(7,54,111,.08);
      padding: 20px 22px 110px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 52px;
      height: 56px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #d8eaf7;
      border-radius: 15px;
      background: #fff;
    }

    .logo-box img {
      display: block;
      width: 43px;
      height: auto;
    }

    .brand {
      margin: 0;
      color: var(--blue);
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: .08em;
    }

    .tagline {
      margin: 6px 0 0;
      color: #66809b;
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .115em;
      text-transform: uppercase;
    }

    .veg-dot {
      width: 14px;
      height: 14px;
      margin-left: auto;
      border-radius: 3px;
      background: var(--green);
      box-shadow: 0 0 0 4px #e6f7ea;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      margin: 21px 1px 8px;
      color: #58718b;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #d9eefc;
    }

    .progress-bar {
      width: 33.333%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #1bb6ff);
      transition: width .25s ease;
    }

    .panel {
      padding-top: 30px;
      animation: rise .25s ease both;
    }

    .back {
      display: none;
      align-items: center;
      gap: 6px;
      margin: 0 0 16px;
      padding: 0;
      border: 0;
      color: #54708d;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 410px;
      margin: 0;
      color: var(--ink);
      font-size: clamp(29px, 8vw, 39px);
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    .help {
      margin: 10px 0 19px;
      color: var(--muted);
      font-size: 14px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #d6e8f5;
      border-radius: 16px;
      color: #183755;
      background: #fbfdff;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      font-weight: 900;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .option:hover, .option:focus-visible {
      outline: none;
      border-color: #72bafb;
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: var(--blue);
      background: #edf7ff;
      box-shadow: 0 0 0 3px rgba(8,125,241,.08);
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1.5px solid #9dbdd6;
      border-radius: 50%;
    }

    .selected .radio {
      border-color: var(--blue);
    }

    .selected .radio::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }

    .draft-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .sparkle {
      width: 39px;
      height: 39px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--blue);
      transform: rotate(-5deg);
      font-size: 19px;
    }

    .draft-head h1 {
      font-size: clamp(28px, 7vw, 36px);
    }

    label {
      display: block;
      margin: 21px 0 8px;
      color: #23415f;
      font-size: 13px;
      font-weight: 950;
    }

    label span {
      margin-left: 4px;
      color: #8497a9;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      resize: vertical;
      border: 1.5px solid #cfe3f3;
      border-radius: 15px;
      outline: none;
      padding: 12px 13px;
      color: #173451;
      background: #fbfdff;
      font-size: 13px;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(8,125,241,.1);
    }

    #extra { min-height: 72px; }

    .review-box {
      margin-top: 13px;
      padding: 13px 14px;
      border: 1px solid #d7e9f6;
      border-radius: 16px;
      background: #eaf6ff;
    }

    .review-box label {
      margin: 0 0 7px;
      color: var(--blue);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    #review {
      min-height: 108px;
      border: 0;
      padding: 0;
      color: #254561;
      background: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
    }

    #review:focus { box-shadow: none; }

    .google-button {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 13px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: var(--blue);
      cursor: pointer;
      font-size: 15px;
      font-weight: 950;
      box-shadow: 0 9px 20px rgba(8,125,241,.22);
    }

    .google-button:hover, .google-button:focus-visible {
      outline: 3px solid rgba(8,125,241,.22);
      outline-offset: 2px;
      background: #056bd0;
    }

    .paste-note {
      max-width: 340px;
      margin: 9px auto 0;
      color: #71879b;
      text-align: center;
      font-size: 10.5px;
      line-height: 1.45;
    }

    .edit {
      display: block;
      margin: 10px auto 0;
      padding: 3px;
      border: 0;
      color: #54708d;
      background: transparent;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 11px;
      font-weight: 900;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 84px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 20% 160%, #1bb6ff 0 18%, transparent 19%),
        radial-gradient(circle at 80% -60%, #1bb6ff 0 18%, transparent 19%),
        var(--deep-blue);
      text-align: center;
    }

    .footer p {
      margin: 0;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer small {
      display: block;
      margin-top: 5px;
      color: #b9ddff;
      font-size: 9px;
      letter-spacing: .12em;
    }

    .hidden { display: none !important; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .page { display: block; padding: 0; }
      .card {
        width: 100%;
        min-height: 100svh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        padding: 18px 18px 102px;
      }
      .panel { padding-top: 27px; }
      .option { min-height: 56px; }
    }

    @media (max-height: 710px) {
      .card { padding-bottom: 82px; }
      .footer { height: 66px; }
      .panel { padding-top: 18px; }
      .options { gap: 7px; }
      .option { min-height: 47px; padding-block: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

            <p class="eyebrow">Made from your answers</p>
            <h1>Your review is ready</h1>
          </div>
        </div>

        <label for="extra">Anything else? <span>Optional</span></label>
        <textarea id="extra" rows="3" placeholder="Add a dish you loved, a team member, or anything else…"></textarea>

        <div class="review-box">
          <label for="review">Your editable review</label>
          <textarea id="review" rows="5"></textarea>
        </div>

        <button class="google-button" id="googleButton" type="button">
          <span aria-hidden="true">⧉</span>
          <span id="buttonCopy">Copy review &amp; open Google</span>
          <span aria-hidden="true">↗</span>
        </button>
        <p class="paste-note">On Google, paste the review, choose your honest rating and post.</p>
        <button class="edit" id="editButton" type="button">Edit my answers</button>
      </section>

      <footer class="footer">
        <div>
          <p>Fresh. Addictive. Pure veg.</p>
          <small>STEAMIO · HSR</small>
        </div>
      </footer>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJ4RF8mAMVrjsRDa5JcDCtvK4";

      var questions = [
        {
          eyebrow: "The highlight",
          title: "What did you enjoy most?",
          options: [
            { label: "The flavours", phrase: "flavours" },
            { label: "Pure-veg variety", phrase: "pure-veg variety" },
            { label: "Fresh dim sums & sushi", phrase: "fresh dim sums and sushi" },
            { label: "Quick service", phrase: "quick service" },
            { label: "The whole experience", phrase: "whole experience" }
          ]
        },
        {
          eyebrow: "The cravings",
          title: "What did you try?",
          options: [
            { label: "Dim sums", phrase: "the dim sums" },
            { label: "Sushi", phrase: "the sushi" },
            { label: "Noodles or ramen", phrase: "the noodles and ramen" },
            { label: "A bit of everything", phrase: "a bit of everything" }
          ]
        },
        {
          eyebrow: "The verdict",
          title: "What would you tell a friend?",
          options: [
            { label: "Absolutely loved it", phrase: "We absolutely loved it." },
            { label: "Worth coming back for", phrase: "It is definitely worth coming back for." },
            { label: "Finally, great veg Asian food", phrase: "It is so nice to finally have great pure-veg Asian food." },
            { label: "Good food, good vibes", phrase: "Good food and genuinely good vibes." },
            { label: "It could be better", phrase: "A few things could be better." }
          ]
        }
      ];

      var step = 0;
      var answers = [null, null, null];

      var questionPanel = document.getElementById("questionPanel");
      var draftPanel = document.getElementById("draftPanel");
      var eyebrow = document.getElementById("eyebrow");
      var question = document.getElementById("question");
      var options = document.getElementById("options");
      var backButton = document.getElementById("backButton");
      var progressBar = document.getElementById("progressBar");
      var stepCopy = document.getElementById("stepCopy");
      var tapCopy = document.getElementById("tapCopy");
      var extra = document.getElementById("extra");
      var review = document.getElementById("review");
      var googleButton = document.getElementById("googleButton");
      var buttonCopy = document.getElementById("buttonCopy");
      var editButton = document.getElementById("editButton");

      function renderQuestion() {
        var item = questions[step];
        questionPanel.classList.remove("hidden");
        draftPanel.classList.add("hidden");
        questionPanel.style.animation = "none";
        void questionPanel.offsetWidth;
        questionPanel.style.animation = "";

        eyebrow.textContent = item.eyebrow;
        question.textContent = item.title;
        stepCopy.textContent = (step + 1) + " of " + questions.length;
        tapCopy.textContent = "Just tap one";
        progressBar.style.width = (((step + 1) / questions.length) * 100) + "%";
        backButton.style.display = step > 0 ? "flex" : "none";
        options.innerHTML = "";

        item.options.forEach(function (option) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "option";
          button.setAttribute("role", "radio");
          button.setAttribute("aria-checked", answers[step] && answers[step].label === option.label ? "true" : "false");
          if (answers[step] && answers[step].label === option.label) {
            button.classList.add("selected");
          }
          button.innerHTML = '<span class="radio" aria-hidden="true"></span><span></span>';
          button.lastElementChild.textContent = option.label;
          button.addEventListener("click", function () {
            answers[step] = option;
            button.classList.add("selected");
            button.setAttribute("aria-checked", "true");
            window.setTimeout(function () {
              step += 1;
              if (step < questions.length) {
                renderQuestion();
              } else {
                renderDraft();
              }
            }, 170);
          });
          options.appendChild(button);
        });
      }

      function buildReview() {
        if (!answers[0] || !answers[1] || !answers[2]) return "";
        var isPositive = answers[2].label !== "It could be better";
        var note = extra.value.trim();
        var text = "Really enjoyed the " + answers[0].phrase + " at STEAMIO. We tried " + answers[1].phrase + ", and " + answers[2].phrase;
        if (note) text += " " + note;
        if (isPositive) {
          text += " Would happily recommend STEAMIO to anyone looking for pure-veg Asian food in Bangalore!";
        }
        return text;
      }

      function renderDraft() {
        questionPanel.classList.add("hidden");
        draftPanel.classList.remove("hidden");
        draftPanel.style.animation = "none";
        void draftPanel.offsetWidth;
        draftPanel.style.animation = "";
        stepCopy.textContent = "Ready to review";
        tapCopy.textContent = "Done";
        progressBar.style.width = "100%";
        review.value = buildReview();
      }

      function fallbackCopy(text) {
        var helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        helper.setSelectionRange(0, helper.value.length);
        var successful = false;
        try { successful = document.execCommand("copy"); } catch (error) { successful = false; }
        document.body.removeChild(helper);
        return successful;
      }

      function copyAndOpenGoogle() {
        var text = review.value.trim();
        if (!text) {
          review.focus();
          return;
        }

        var copyPromise;
        if (navigator.clipboard && window.isSecureContext) {
          copyPromise = navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return fallbackCopy(text); });
        } else {
          copyPromise = Promise.resolve(fallbackCopy(text));
        }

        copyPromise.then(function (copied) {
          buttonCopy.textContent = copied ? "Copied — opening Google" : "Opening Google — copy your review";
          window.setTimeout(function () {
            window.location.assign(GOOGLE_REVIEW_URL);
          }, 320);
        });
      }

      backButton.addEventListener("click", function () {
        if (step > 0) {
          step -= 1;
          renderQuestion();
        }
      });

      editButton.addEventListener("click", function () {
        step = 0;
        renderQuestion();
      });

      extra.addEventListener("input", function () {
        review.value = buildReview();
      });

      googleButton.addEventListener("click", copyAndOpenGoogle);
      renderQuestion();
    }());
  </script>
</body>
</html>
