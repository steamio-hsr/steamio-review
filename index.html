<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Steamio — Share your experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-logo:#1E90FF;
    --blue-dark:#0B5FA8;
    --navy:#0A3D66;
    --ink:#142433;
    --ink-soft:#5B6B78;
    --bg:#F3F8FC;
    --card:#FFFFFF;
    --line:#E3EDF4;
    --success:#1F9D63;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow: 0 8px 24px rgba(10,61,102,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#0B5FA8 0%,#1E90FF 100%);
    padding:34px 24px 40px;
    text-align:center;
    border-radius:0 0 28px 28px;
    box-shadow:var(--shadow);
  }
  .steam-wisp{
    position:absolute;
    top:-10px;
    opacity:0.35;
    stroke:#fff;
    fill:none;
    stroke-width:6;
    stroke-linecap:round;
    animation: drift 6s ease-in-out infinite;
  }
  .steam-wisp.w1{left:12%; animation-delay:0s;}
  .steam-wisp.w2{left:48%; animation-delay:1.2s; opacity:0.25;}
  .steam-wisp.w3{left:78%; animation-delay:2.1s; opacity:0.3;}
  @keyframes drift{
    0%{ transform:translateY(0) scaleY(1); opacity:0.1;}
    50%{ transform:translateY(10px) scaleY(1.05); opacity:0.4;}
    100%{ transform:translateY(0) scaleY(1); opacity:0.1;}
  }
  @media (prefers-reduced-motion: reduce){
    .steam-wisp{animation:none; opacity:0.2;}
  }

  .logo-mark{
    position:relative;
    width:120px;
    height:auto;
    margin:0 auto 6px;
    display:block;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  .locate{
    position:relative;
    color:rgba(255,255,255,0.9);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.02em;
    margin:0 0 18px;
  }
  .hero h1{
    position:relative;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:23px;
    line-height:1.25;
    color:#fff;
    margin:0 0 6px;
  }
  .hero p.sub{
    position:relative;
    color:rgba(255,255,255,0.85);
    font-size:14px;
    margin:0;
  }

  /* ---------- Main / form ---------- */
  main{
    flex:1;
    padding:22px 20px 28px;
  }
  .qgroup{margin-bottom:22px;}
  .qlabel{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--navy);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qlabel .emoji{font-size:18px;}

  .options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
  }
  .opt{
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:10px 15px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition: all 0.15s ease;
    line-height:1.3;
  }
  .opt:active{ transform: scale(0.96); }
  .opt.selected{
    background:var(--blue-dark);
    border-color:var(--blue-dark);
    color:#fff;
    box-shadow:0 4px 10px rgba(11,95,168,0.28);
  }

  .other-field{margin:26px 0 24px;}
  .other-field label{
    display:block;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--navy);
    margin-bottom:10px;
  }
  .other-field label span{
    color:var(--ink-soft);
    font-weight:400;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .other-field textarea{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--card);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    resize:none;
    min-height:56px;
    outline:none;
  }
  .other-field textarea:focus{ border-color:var(--blue-logo); }

  .primary-btn{
    width:100%;
    border:none;
    border-radius:var(--radius-md);
    background:var(--blue-dark);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(11,95,168,0.28);
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .primary-btn:disabled{
    background:#B9C8D3;
    box-shadow:none;
    cursor:not-allowed;
    opacity:0.85;
  }
  .primary-btn:not(:disabled):active{ transform:scale(0.98); }
  .hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-top:10px;
  }

  /* ---------- Result screen ---------- */
  #result-screen{ display:none; }
  #result-screen.active{ display:block; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .result-heading{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--navy);
    margin:0 0 4px;
  }
  .result-sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 16px;
  }
  .review-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-lg);
    padding:6px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  #reviewText{
    width:100%;
    min-height:150px;
    border:none;
    background:transparent;
    resize:vertical;
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    line-height:1.55;
    color:var(--ink);
    padding:14px;
    outline:none;
  }
  .btn-row{ display:flex; flex-direction:column; gap:10px; }
  .copy-btn{
    width:100%;
    border:none;
    border-radius:var(--radius-md);
    background:var(--blue-dark);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 8px 18px rgba(11,95,168,0.28);
  }
  .copy-btn.copied{ background:var(--success); box-shadow:0 8px 18px rgba(31,157,99,0.28); }
  .copy-btn:active{ transform:scale(0.98); }

  .google-btn{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    background:#fff;
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    transition: opacity 0.2s ease, border-color 0.2s ease;
  }
  .google-btn.enabled{ border-color:var(--blue-logo); }
  .google-btn:active{ transform:scale(0.98); }

  .back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:500;
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  /* focus visibility for keyboard users */
  button:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2.5px solid var(--blue-logo);
    outline-offset:2px;
  }
</style>
</head>

      </button>
      <a id="googleBtn" class="google-btn" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l6-6C33.6 6.5 29.1 4.5 24 4.5 12.9 4.5 4 13.4 4 24.5s8.9 20 20 20c11 0 19.4-7.9 19.4-19.5 0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l6-6C33.6 6.5 29.1 4.5 24 4.5c-7.8 0-14.5 4.5-17.7 10.2z"/><path fill="#4CAF50" d="M24 44.5c5 0 9.5-1.9 13-5l-6.2-5.3C28.7 35.9 26.5 36.5 24 36.5c-5.3 0-9.7-2.9-11.3-7l-6.4 5C9.5 40.4 16.2 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6.1l6.2 5.3C39.8 36.9 44 31.5 44 24.5c0-1.4-.1-2.7-.4-4z"/></svg>
        Post on Google
      </a>
    </div>

    <button id="backBtn" class="back-link">← Edit my answers</button>
  </main>

</div>

<script>
  const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJ4RF8mAMVrjsRDa5JcDCtvK4";

  const state = { food:null, service:null, overall:null };

  document.querySelectorAll('.qgroup').forEach(group=>{
    const key = group.dataset.q;
    group.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        group.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        state[key] = btn.dataset.phrase;
        checkReady();
      });
    });
  });

  const generateBtn = document.getElementById('generateBtn');
  const formHint = document.getElementById('formHint');

  function checkReady(){
    const ready = state.food && state.service && state.overall;
    generateBtn.disabled = !ready;
    formHint.textContent = ready ? "Looks good — ready to generate" : "Pick one option in each question above";
  }

  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  const OPENERS = [
    "Great visit to Steamio HSR.",
    "Really enjoyed my time at Steamio.",
    "Steamio HSR never disappoints.",
    "Had a lovely experience at Steamio."
  ];

  function buildReview(){
    const opener = OPENERS[Math.floor(Math.random()*OPENERS.length)];
    const middle = `${cap(state.food)}, and ${state.service}.`;
    const closing = cap(state.overall) + (state.overall.endsWith('!') ? '' : '!');
    let review = `${opener} ${middle} ${closing}`;

    const other = document.getElementById('otherInput').value.trim();
    if (other){
      const punctuated = /[.!?]$/.test(other) ? other : other + '.';
      review += ' ' + cap(punctuated);
    }
    return review;
  }

  const formScreen = document.getElementById('form-screen');
  const resultScreen = document.getElementById('result-screen');
  const reviewText = document.getElementById('reviewText');
  const googleBtn = document.getElementById('googleBtn');

  generateBtn.addEventListener('click', ()=>{
    reviewText.value = buildReview();
    googleBtn.href = GOOGLE_REVIEW_URL;
    formScreen.style.display = 'none';
    resultScreen.classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  document.getElementById('backBtn').addEventListener('click', ()=>{
    resultScreen.classList.remove('active');
    formScreen.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  });

  const copyBtn = document.getElementById('copyBtn');
  const copyLabel = document.getElementById('copyLabel');

  copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(reviewText.value);
    }catch(e){
      reviewText.select();
      document.execCommand('copy');
    }
    copyBtn.classList.add('copied');
    copyLabel.textContent = 'Copied ✓';
    googleBtn.classList.add('enabled');
    setTimeout(()=>{
      copyBtn.classList.remove('copied');
      copyLabel.textContent = 'Copy review';
    }, 2200);
  });
</script>
</body>
</html>
